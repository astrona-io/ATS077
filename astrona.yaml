# Hands-on course: readings, playgrounds, module labs, section capstones and quizzes. Built untested.
training:
  id: ATS077
  title: 'CNPA: Platform Engineering Core Fundamentals'
  description: 'Hands-on preparation for CNPA: Platform Engineering Core Fundamentals. Each section has
    readings, a playground, a module lab, a graded capstone and a quiz. Content is draft and the labs are untested.'
  certification:
    name: Certified Cloud Native Platform Engineering Associate
    code: CNPA
    provider: CNCF / Linux Foundation
    domain: Platform Engineering Core Fundamentals
    weight: 36
    competencies:
    - Declarative Resource Management
    - DevOps Practices in Platform Engineering
    - Application Environments and Infrastructure Concepts
    - Platform Architecture and Capabilities
    - Platform Engineering Goals, Objectives, and Approaches
    - Continuous Integration Fundamentals
    - Continuous Delivery and GitOps
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: "Declarative Resource Management"
  description: >
    Makes the reader able to state desired state as resources, render it with Kustomize, and explain how controllers, owner references, field managers and status keep the live system matching the declaration.
  status: alpha

  content:
    - type: reading
      title: "Section Overview"
      path: sections/section-010/README.md
    - type: reading
      title: "Sufficient Intent, Rendering And Controller Contracts"
      path: sections/section-010/module-01/course.md
    - type: reading
      title: "Desired State, The API Server And Controllers"
      path: sections/section-010/module-01/course-01-sufficient-intent-rendering-and-controller-contracts.md
    - type: reading
      title: "Rendering Declarations With Kustomize"
      path: sections/section-010/module-01/course-02-rendering-declarations-with-kustomize.md
    - type: reading
      title: "Ownership, Drift And Field Managers"
      path: sections/section-010/module-01/course-03-ownership-drift-and-field-managers.md
    - type: reading
      title: "Question"
      path: sections/section-010/module-01/labs/lab-01/question.md
    - type: lab
      title: "Declare, Render And Apply Under A Field Manager Lab"
      path: sections/section-010/module-01/labs/lab-01
      difficulty: intermediate
      estimated_duration: 25m
      topic: declarative-management
      task_kind: build
      tags: [kustomize, deployment, owner-reference, server-side-apply, field-manager]
      learning_goals:
        - Replace a bare pod with a Deployment so a controller owns it
        - Render an overlay with a namespace, a name prefix, a label and a replica patch
        - Apply the render with server-side apply under a named field manager
      resources:
        - name: "Declarative management of Kubernetes objects using Kustomize"
          url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
        - name: "Server-Side Apply"
          url: https://kubernetes.io/docs/reference/using-api/server-side-apply/
    - type: reading
      title: "Summary"
      path: sections/section-010/module-01/course-04-summary.md
    - type: reading
      title: "Question"
      path: sections/section-010/capstone/labs/lab-01/question.md
    - type: lab
      title: "Declarative Resource Management Capstone"
      path: sections/section-010/capstone/labs/lab-01
      difficulty: advanced
      estimated_duration: 40m
      topic: declarative-management
      task_kind: build
      tags: [kustomize, drift, server-side-apply, field-manager, generation, status]
      learning_goals:
        - Remove drift from a Deployment by forcing a server-side apply under a named manager
        - Render two Deployments for another namespace from one overlay with patches
        - Record metadata.generation and status.observedGeneration as rollout evidence
      resources:
        - name: "Server-Side Apply"
          url: https://kubernetes.io/docs/reference/using-api/server-side-apply/
        - name: "Kustomize patches"
          url: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
    - type: quiz
      title: "Knowledge Check: Declarative Resource Management"
      path: sections/section-010/quiz.yaml
      pass_score: 70

- id: module-020
  title: "DevOps Practices in Platform Engineering"
  description: >
    Makes the reader able to record ownership on cluster objects, read feedback from probes and rollouts, roll back a failed release, and build security and access guardrails that let a team deploy alone.
  status: alpha

  content:
    - type: reading
      title: "Section Overview"
      path: sections/section-020/README.md
    - type: reading
      title: "Shared Ownership, Feedback And Platform Enablement"
      path: sections/section-020/module-01/course.md
    - type: reading
      title: "Shared Ownership And Platform Enablement"
      path: sections/section-020/module-01/course-01-shared-ownership-feedback-and-platform-enablement.md
    - type: reading
      title: "Feedback Signals: Probes, Rollouts And Rollback"
      path: sections/section-020/module-01/course-02-feedback-signals-probes-and-rollouts.md
    - type: reading
      title: "DevSecOps Guardrails In The Platform"
      path: sections/section-020/module-01/course-03-devsecops-guardrails-in-the-platform.md
    - type: reading
      title: "Question"
      path: sections/section-020/module-01/labs/lab-01/question.md
    - type: lab
      title: "Ownership, Probes And A Restricted Namespace Lab"
      path: sections/section-020/module-01/labs/lab-01
      difficulty: intermediate
      estimated_duration: 25m
      topic: devops
      task_kind: fix
      tags: [labels, readiness-probe, pod-security, securitycontext, ownership]
      learning_goals:
        - Put an ownership label in pod templates so running pods carry it
        - Add an HTTP readiness probe to a container
        - Enforce the restricted Pod Security Standard and make a Deployment comply
      resources:
        - name: "Pod Security Admission"
          url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
        - name: "Configure liveness, readiness and startup probes"
          url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    - type: reading
      title: "Summary"
      path: sections/section-020/module-01/course-04-summary.md
    - type: reading
      title: "Question"
      path: sections/section-020/capstone/labs/lab-01/question.md
    - type: lab
      title: "DevOps Practices Capstone"
      path: sections/section-020/capstone/labs/lab-01
      difficulty: advanced
      estimated_duration: 40m
      topic: devops
      task_kind: fix
      tags: [rollout, rollback, readiness-probe, pod-security, rbac, ownership]
      learning_goals:
        - Recover a stuck rollout with rollout undo and protect the next release with a readiness probe
        - Enforce the restricted standard in a namespace and fix a workload to comply
        - Grant a team group least-privilege deploy access with a Role and a RoleBinding
      resources:
        - name: "Using RBAC Authorization"
          url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        - name: "Deployments"
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - type: quiz
      title: "Knowledge Check: DevOps Practices in Platform Engineering"
      path: sections/section-020/quiz.yaml
      pass_score: 70

- id: module-030
  title: "Application Environments and Infrastructure Concepts"
  description: >
    Makes the reader able to separate environments with namespaces, quotas, limits, identity and data, and to keep one artifact consistent across environments with per-environment configuration.
  status: alpha

  content:
