# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# DevOps Practices Capstone (LAB, capstone). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: a failed probe rollout (missing image, old pod still running), a drifter Deployment that runs as root in outpost, and no access for any team group.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: probe-recovered
      description: probe runs its original image, is available and has a readiness probe
      type: file
      source: validation/validate-probe-recovered.sh
      hint: The failed rollout left the old pod running. Roll the Deployment back to the previous revision, then add an httpGet readiness probe on /status/200.
    - name: outpost-restricted
      description: outpost enforces restricted and drifter runs as a non-root user with the owner label
      type: file
      source: validation/validate-outpost-restricted.sh
      hint: Label the namespace, then fix the drifter pod template (non-root numeric user, seccomp RuntimeDefault, no privilege escalation, drop ALL) and add owner=drifter-team to the template labels.
    - name: team-access
      description: The group drifter-team can update Deployments in outpost, cannot delete them, and has no access to Secrets or to starfleet
      type: file
      source: validation/validate-team-access.sh
      hint: Create a Role with get, list, watch, create, update and patch on deployments and read access to pods and pod logs, and a RoleBinding to the group drifter-team in outpost. Do not bind edit or admin.
    - name: workloads-running
      description: scout and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the Deployments.

teardown:
  keepCluster: false
