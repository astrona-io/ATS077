# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Ownership, Probes And A Restricted Namespace (LAB). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads without ownership labels, probe without a readiness probe, and a namespace sandbox whose crew Deployment has no security context.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: owner-labels
      description: Pods of scout, probe and shuttle carry the label owner=bridge-team
      type: file
      source: validation/validate-owner-labels.sh
      hint: The label must be in spec.template.metadata.labels of each Deployment, so that the running pods carry it. Wait for the rollout.
    - name: probe-readiness
      description: probe has an HTTP readiness probe and is available
      type: file
      source: validation/validate-probe-readiness.sh
      hint: Add a readinessProbe with an httpGet handler to the probe container. go-httpbin answers on /status/200.
    - name: sandbox-restricted
      description: sandbox enforces the restricted standard and crew runs with a compliant security context
      type: file
      source: validation/validate-sandbox-restricted.sh
      hint: Label the namespace pod-security.kubernetes.io/enforce=restricted and set runAsNonRoot, a numeric runAsUser, seccompProfile RuntimeDefault, allowPrivilegeEscalation false and drop ALL capabilities.
    - name: workloads-running
      description: scout, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the Deployments.

teardown:
  keepCluster: false
