apiVersion: v1
kind: Namespace
metadata:
  name: adopt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-web
  namespace: adopt
  labels:
    app: bridge-web
    platform.starfleet.io/path: golden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge-web
  template:
    metadata:
      labels:
        app: bridge-web
        platform.starfleet.io/path: golden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-web
  namespace: adopt
  labels:
    app: engine-web
    platform.starfleet.io/path: golden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-web
  template:
    metadata:
      labels:
        app: engine-web
        platform.starfleet.io/path: golden
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
---
