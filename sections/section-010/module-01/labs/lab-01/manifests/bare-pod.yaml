apiVersion: v1
kind: Pod
metadata:
  name: shuttle-debug
  namespace: starfleet
  labels:
    app: shuttle-debug
spec:
  serviceAccountName: shuttle
  containers:
    - name: shuttle-debug
      image: curlimages/curl:8.22.0
      command: ["sh", "-c", "while true; do sleep 30; done"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
