# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Declare, Render And Apply Under A Field Manager (LAB). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads and a bare pod named shuttle-debug in starfleet that no controller owns.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: debug-pod-managed
      description: shuttle-debug runs from a Deployment with 2 available replicas and no bare pod remains
      type: file
      source: validation/validate-debug-pod-managed.sh
      hint: Delete the bare pod shuttle-debug, then declare a Deployment named shuttle-debug in starfleet with 2 replicas and the same image.
    - name: outpost-scout-rendered
      description: outpost-scout in outpost is rendered with 2 replicas and the tier edge label
      type: file
      source: validation/validate-outpost-scout-rendered.sh
      hint: Write a base with the scout Deployment and an overlay with namespace outpost, namePrefix outpost-, labels tier edge with includeSelectors, and a replicas patch. Apply it with kubectl apply -k.
    - name: field-manager-platform-team
      description: outpost-scout is owned by the field manager platform-team through server-side apply
      type: file
      source: validation/validate-field-manager.sh
      hint: Render with kubectl kustomize and pipe it to kubectl apply --server-side --field-manager=platform-team -f -.
    - name: workloads-running
      description: scout, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the starting Deployments.

teardown:
  keepCluster: false
