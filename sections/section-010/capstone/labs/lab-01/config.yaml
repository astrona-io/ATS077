# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Declarative Resource Management Capstone (LAB, capstone). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, a shuttle Deployment scaled to 4 by hand while its declaration (1 replica) is stored in a ConfigMap, and a bare pod drifter-debug in outpost.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: shuttle-drift-removed
      description: shuttle has 1 replica again and the field manager platform-team owns spec.replicas
      type: file
      source: validation/validate-shuttle-drift-removed.sh
      hint: Read the declaration from the ConfigMap desired-state, then run a server-side apply with --field-manager=platform-team and --force-conflicts.
    - name: outpost-rendered
      description: outpost-scout and outpost-probe are rendered with the team label, replica counts and resource requests
      type: file
      source: validation/validate-outpost-rendered.sh
      hint: One overlay can list both Deployments in its base. Use namePrefix, namespace, labels with includeSelectors and a patch for the resource requests of both containers.
    - name: debug-pod-managed
      description: drifter-debug in outpost runs from a Deployment and no bare pod remains
      type: file
      source: validation/validate-debug-pod-managed.sh
      hint: Delete the bare pod drifter-debug and declare a Deployment drifter-debug with 1 replica and the same image.
    - name: rollout-evidence
      description: The ConfigMap rollout-evidence in outpost records the live generation numbers of outpost-scout
      type: file
      source: validation/validate-rollout-evidence.sh
      hint: Read metadata.generation, status.observedGeneration and status.readyReplicas with jsonpath and store the three values under the keys generation, observed-generation and ready-replicas.
    - name: workloads-running
      description: scout, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete or replace the starting Deployments.

teardown:
  keepCluster: false
