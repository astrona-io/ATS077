apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: source
  namespace: ci
data:
  revision: r2
  greeting: hello from scout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: staging
data:
  PODINFO_UI_MESSAGE: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
        release: r1
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  PODINFO_UI_MESSAGE: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
        release: r1
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
                name: app-config
