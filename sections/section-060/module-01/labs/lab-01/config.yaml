# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Pipeline Stages And Promotion (LAB). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-lab-060-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads and the namespaces ci, staging and production, with a ConfigMap source in ci that holds the revision to build
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: check-stage
      description: The Job unit-checks in ci succeeded, labelled with the source revision and reading the ConfigMap source
      type: file
      source: validation/validate-check-stage.sh
      hint: Mount the ConfigMap source as a volume, run a command that exits zero when the revision file is present, and label the Job ci.starfleet.io/revision with the revision from the ConfigMap.
    - name: build-record
      description: The ConfigMap build-record in ci ties the revision, the pinned image, the checks and the Job together
      type: file
      source: validation/validate-build-record.sh
      hint: Keys revision, image, checks and job. The revision comes from the ConfigMap source and the image is ghcr.io/stefanprodan/podinfo:6.15.0.
    - name: promotion
      description: staging and production run the image named in the build record, each with its own app-config
      type: file
      source: validation/validate-promotion.sh
      hint: One Deployment named scout in each namespace, envFrom a ConfigMap app-config whose PODINFO_UI_MESSAGE is the environment name.
    - name: workloads-running
      description: scout, probe and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the starfleet Deployments.

teardown:
  keepCluster: false
