# Knowledge check for section 070. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats077-070
course_id: ATS077
exam_code: CNPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-070
  title: "Continuous Delivery and GitOps"
questions:
  - id: ats077-070-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe pull-based reconciliation"
    source_readings:
      - sections/section-070/module-01/course-01-gitops-reconciliation-and-drift.md
    prompt: |-
      An Application has no `automated` sync policy. Its source in Git has changed. What does Argo CD do?
    options:
      - id: a
        text: "It applies the change at once."
        explanation: "Applying needs a sync, which this policy does not trigger."
      - id: b
        text: "It reports `OutOfSync` and waits, because no policy allows it to apply."
        explanation: "Correct. The controller compares and reports."
      - id: c
        text: "It deletes the live resources."
        explanation: "Deleting needs `prune` in an automated or manual sync."
      - id: d
        text: "It rolls back the commit."
        explanation: "The controller never rewrites Git."
    correct_option: b
    explanation: "Without an automated policy the controller only reports the difference."

  - id: ats077-070-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain drift and self-heal"
    source_readings:
      - sections/section-070/module-01/course-01-gitops-reconciliation-and-drift.md
    prompt: |-
      `selfHeal` is on and an operator scales a synced Deployment from one replica to three during an incident. What happens?
    options:
      - id: a
        text: "The controller restores one replica, because Git declares one."
        explanation: "Correct. Self-heal reverts live changes to declared state."
      - id: b
        text: "The controller commits three replicas to Git."
        explanation: "The controller does not write to Git."
      - id: c
        text: "Nothing, because replicas are not tracked."
        explanation: "The replica count is part of the declared resource."
      - id: d
        text: "The Application is deleted."
        explanation: "Drift does not delete an Application."
    correct_option: a
    explanation: "A manual change that differs from Git is corrected, so an emergency change must be recorded in the source."

  - id: ats077-070-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what pruning removes"
    source_readings:
      - sections/section-070/module-01/course-01-gitops-reconciliation-and-drift.md
    prompt: |-
      What does `prune: true` do in an automated sync policy?
    options:
      - id: a
        text: "It removes old Git commits."
        explanation: "Pruning does not touch the repository."
      - id: b
        text: "It reduces replica counts."
        explanation: "Replica counts come from the declaration."
      - id: c
        text: "It deletes live resources that were removed from the source."
        explanation: "Correct. A resource that Git no longer declares is deleted."
      - id: d
        text: "It skips resources that fail validation."
        explanation: "Validation errors fail the sync."
    correct_option: c
    explanation: "Prune keeps the cluster equal to the source in both directions."

  - id: ats077-070-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate Git storage from GitOps"
    source_readings:
      - sections/section-070/module-01/course-01-gitops-reconciliation-and-drift.md
    prompt: |-
      A team says it practices GitOps because all manifests are stored in a repository, and an engineer applies them by hand. What is missing?
    options:
      - id: a
        text: "A larger repository."
        explanation: "Size is not the issue."
      - id: b
        text: "Automated retrieval and continuous reconciliation of the declared state."
        explanation: "Correct. Storing files in Git alone is not GitOps."
      - id: c
        text: "A Helm chart."
        explanation: "A chart is a packaging choice."
      - id: d
        text: "A second branch."
        explanation: "Branches do not reconcile anything."
    correct_option: b
    explanation: "Pull, versioning and reconciliation together make the approach."

  - id: ats077-070-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Review rendered output"
    source_readings:
      - sections/section-070/module-01/course-02-helm-kustomize-and-configuration-rendering.md
    prompt: |-
      Why render a Kustomize overlay before approving a change to the base?
    options:
      - id: a
        text: "Rendering applies the change to the cluster."
        explanation: "`kubectl kustomize` only prints."
      - id: b
        text: "A base change affects every overlay, and the rendered output shows names, namespaces, selectors and images that each overlay produces."
        explanation: "Correct. Reviewing the inputs alone can miss an interaction."
      - id: c
        text: "Rendering makes Helm unnecessary."
        explanation: "The tools are independent."
      - id: d
        text: "Rendering signs the manifests."
        explanation: "Rendering does not sign anything."
    correct_option: b
    explanation: "The API receives the rendered resources, so review them."

  - id: ats077-070-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Compare Helm templating with Kustomize overlays"
    source_readings:
      - sections/section-070/module-01/course-02-helm-kustomize-and-configuration-rendering.md
    prompt: |-
      Which statement about Helm and Kustomize is correct?
    options:
      - id: a
        text: "Both reconcile the cluster continuously on their own."
        explanation: "A controller does that."
      - id: b
        text: "Helm and Kustomize produce configuration, and a GitOps controller can render either and reconcile the result."
        explanation: "Correct. They are separate parts of the workflow."
      - id: c
        text: "Kustomize requires a chart."
        explanation: "It works from plain resource files."
      - id: d
        text: "Helm cannot be used with a Git repository."
        explanation: "A chart can live in Git."
    correct_option: b
    explanation: "Packaging and reconciliation are different parts of the workflow."

  - id: ats077-070-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tie a commit to the synced revision"
    source_readings:
      - sections/section-070/module-01/course-03-promotion-through-git-and-revision-evidence.md
    prompt: |-
      Production is promoted by a commit. `git rev-parse HEAD` prints one hash and `.status.sync.revision` of the Application prints another. What does it mean?
    options:
      - id: a
        text: "The promotion succeeded."
        explanation: "The revisions would be equal if it had."
      - id: b
        text: "The controller has not reached the commit yet, or it failed to render or apply it, so read the Application conditions."
        explanation: "Correct. Equal revisions are the evidence of delivery."
      - id: c
        text: "The hashes always differ."
        explanation: "They are equal when the controller is current."
      - id: d
        text: "The repository is corrupt."
        explanation: "A difference is not corruption."
    correct_option: b
    explanation: "The synced revision is the evidence that the commit was delivered."

  - id: ats077-070-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain what a revert does and does not undo"
    source_readings:
      - sections/section-070/module-01/course-03-promotion-through-git-and-revision-evidence.md
    prompt: |-
      A bad release is undone with `git revert` and a push. What does the revert not do?
    options:
      - id: a
        text: "Restore the earlier declared configuration."
        explanation: "It does restore it."
      - id: b
        text: "Create a new entry in the history."
        explanation: "It does create a new commit."
      - id: c
        text: "Reverse a data migration that the new version ran or an external effect it caused."
        explanation: "Correct. A revert changes configuration only."
      - id: d
        text: "Let the controller deliver the earlier image."
        explanation: "The controller delivers the reverted state."
    correct_option: c
    explanation: "Recovery must cover state outside the repository."

