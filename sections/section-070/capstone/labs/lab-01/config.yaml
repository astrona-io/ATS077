# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# GitOps And Deployment Capstone (LAB, capstone). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-capstone-070
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

# Starting state: the workloads, Argo CD 3.5.4, a seeded Git repository, repository credentials and both Applications delivered (staging 6.15.0, production 6.14.0).
bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git"
      type: file
      source: bootstrap/03-seed.sh
    - name: applications
      description: "Creates repository credentials and both Applications"
      type: file
      source: bootstrap/04-applications.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: production-promoted
      description: Git declares 6.15.0 for production, scout-production is Synced and Healthy and production runs 6.15.0
      type: file
      source: validation/validate-production-promoted.sh
      hint: Change newTag in overlays/production/kustomization.yaml, commit and push to main. Do not change the Deployment with kubectl.
    - name: promotion-record
      description: The ConfigMap promotion-record names the commit that is the head of main and the revision Argo CD synced
      type: file
      source: validation/validate-promotion-record.sh
      hint: Keys commit, synced-revision, image and environment. Read the commit with git rev-parse HEAD and the synced revision from .status.sync.revision of scout-production.
    - name: applications-intact
      description: Both Applications keep automated prune and selfHeal on main, and production is still owned by scout-production
      type: file
      source: validation/validate-applications-intact.sh
      hint: Do not turn off selfHeal, delete an Application or apply the Deployment by hand. Staging stays at 6.15.0.
    - name: workloads-running
      description: scout, probe and shuttle in starfleet are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the starfleet Deployments.

teardown:
  keepCluster: false
