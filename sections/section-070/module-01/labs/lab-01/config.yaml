# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# GitOps Delivery Lab (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-lab-070-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

# Starting state: the workloads, Argo CD 3.5.4 and a seeded Git repository. No credentials and no Application.
bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the scout-deploy repository into Git"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: application-definition
      description: Argo CD can read the repository and the Application scout-staging is defined with automated prune and selfHeal
      type: file
      source: validation/validate-application-definition.sh
      hint: A Secret in argocd labelled argocd.argoproj.io/secret-type=repository with type git, the in-cluster URL of starfleet/scout-deploy, username platform and password starfleet-gitops, and an Application with path overlays/staging.
    - name: delivered
      description: scout-staging is Synced and Healthy, scout runs 6.15.0 in staging and answers from shuttle
      type: file
      source: validation/validate-delivered.sh
      hint: Set destination namespace staging, use syncOptions CreateNamespace=true, and wait for the Application to report Synced and Healthy. Do not apply the overlay with kubectl.
    - name: self-heal
      description: A manual scale of scout in staging is reverted to the value in Git
      type: file
      source: validation/validate-self-heal.sh
      hint: Set syncPolicy.automated.selfHeal to true.
    - name: workloads-running
      description: scout, probe and shuttle in starfleet are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the starfleet Deployments.

teardown:
  keepCluster: false
