# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Platform Architecture Capstone (LAB, capstone). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, the AppRequest CRD and a service account apprequest-controller in starfleet. No policy and no roles exist.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: replica-cap-policy
      description: A ValidatingAdmissionPolicy with failurePolicy Fail and a Deny binding caps Deployments at 3 replicas in namespaces labeled platform=managed
      type: file
      source: validation/validate-replica-cap-policy.sh
      hint: Create the policy starfleet-replica-cap and the binding starfleet-replica-cap-binding, label the namespace starfleet with platform=managed, and keep scout, probe and shuttle at their current replicas.
    - name: team-submit-access
      description: drifter-team can create and read AppRequests in outpost and nothing more
      type: file
      source: validation/validate-team-submit-access.sh
      hint: Create the ClusterRole apprequest-submitter with create, get, list and watch on apprequests, and bind it with a RoleBinding in outpost. Do not grant update, delete or the status subresource.
    - name: controller-access
      description: The service account apprequest-controller can read AppRequests everywhere and write their status, and cannot create or delete them
      type: file
      source: validation/validate-controller-access.sh
      hint: Create the ClusterRole apprequest-controller with get, list and watch on apprequests and update and patch on apprequests/status, and bind it with a ClusterRoleBinding to the service account in starfleet.
    - name: workloads-running
      description: scout and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the Deployments.

teardown:
  keepCluster: false
