# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Custom Resource As A Platform API Lab (LAB). Graded against the live
# cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-077-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads only. No custom resource definition exists.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the cluster settled after the solution
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: crd-defined
      description: The CRD apprequests.platform.starfleet.io is established, namespaced, version v1, with the status subresource
      type: file
      source: validation/validate-crd-defined.sh
      hint: Group platform.starfleet.io, kind AppRequest, plural apprequests, scope Namespaced, one version v1 that is served and stored, with subresources.status enabled.
    - name: crd-validation
      description: The API server accepts good AppRequests and rejects a bad tier, bad replicas, a missing name and a large request without a contact
      type: file
      source: validation/validate-crd-validation.sh
      hint: Use an enum for tier, minimum 1 and maximum 5 for replicas, required name and tier, and an x-kubernetes-validations rule for the contact.
    - name: request-accepted
      description: scout-request exists in starfleet and its status phase is Accepted
      type: file
      source: validation/validate-request-accepted.sh
      hint: Create the object with name scout, tier small and replicas 2. Write the phase through the status subresource with kubectl patch --subresource=status.
    - name: workloads-running
      description: scout and shuttle are still available with their original images
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete, scale down or replace the Deployments.

teardown:
  keepCluster: false
