# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats077-040
course_id: ATS077
exam_code: CNPA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Platform Architecture and Capabilities"
questions:
  - id: ats077-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe capability, control and implementation layers"
    source_readings:
      - sections/section-040/module-01/course-01-capability-layers-control-planes-and-supported-interfaces.md
    prompt: |-
      Which description matches the three layers of a platform?
    options:
      - id: a
        text: "Developers, operators and managers."
        explanation: "These are groups of people, not layers."
      - id: b
        text: "Build, test and deploy."
        explanation: "These are pipeline stages."
      - id: c
        text: "Interface that users call, control plane that makes requests true, infrastructure that runs the work."
        explanation: "Correct. Requests go down and status comes up."
      - id: d
        text: "Frontend, backend and database."
        explanation: "This is an application architecture."
    correct_option: c
    explanation: "The layers separate interface from implementation."

  - id: ats077-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish interfaces from the systems that do the work"
    source_readings:
      - sections/section-040/module-01/course-01-capability-layers-control-planes-and-supported-interfaces.md
    prompt: |-
      `scout` is scaled from one to two replicas. The Service `scout` is unchanged, and its EndpointSlice lists two addresses. What does this show?
    options:
      - id: a
        text: "The Service is an interface, and controllers keep the implementation behind it up to date."
        explanation: "Correct. The name and port keep their meaning."
      - id: b
        text: "The user must edit the EndpointSlice by hand."
        explanation: "A controller maintains it."
      - id: c
        text: "The Service selector changed."
        explanation: "Nothing in the Service changed."
      - id: d
        text: "The scheduler updated the Service."
        explanation: "The scheduler places pods only."
    correct_option: a
    explanation: "A supported interface hides the implementation."

  - id: ats077-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a CRD does and does not do"
    source_readings:
      - sections/section-040/module-01/course-02-a-custom-resource-as-a-platform-api.md
    prompt: |-
      A CRD is applied and a custom resource is created. No Deployment appears. What explains this?
    options:
      - id: a
        text: "The CRD has a syntax error."
        explanation: "The object was accepted, so the CRD works."
      - id: b
        text: "Custom resources are deleted after a minute."
        explanation: "They are stored until deleted."
      - id: c
        text: "The namespace has a quota."
        explanation: "A quota is not involved."
      - id: d
        text: "A CRD only defines, stores and validates objects. A controller must watch them and create workloads."
        explanation: "Correct. The CRD is the interface and a controller is the implementation."
    correct_option: d
    explanation: "Behavior comes from a controller."

  - id: ats077-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about schema validation"
    source_readings:
      - sections/section-040/module-01/course-02-a-custom-resource-as-a-platform-api.md
    prompt: |-
      A custom resource has `tier: huge`, but the schema has an enum of three values. Where is it rejected?
    options:
      - id: a
        text: "By the controller when it reads the object."
        explanation: "The object is never stored."
      - id: b
        text: "By the API server before the object is stored, with a message that lists the supported values."
        explanation: "Correct. Schema validation runs in the API server."
      - id: c
        text: "By the kubelet on the node."
        explanation: "The kubelet is not involved."
      - id: d
        text: "It is accepted and ignored."
        explanation: "The enum is enforced."
    correct_option: b
    explanation: "Validation happens at admission."

  - id: ats077-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain spec and status separation"
    source_readings:
      - sections/section-040/module-01/course-02-a-custom-resource-as-a-platform-api.md
    prompt: |-
      Why does a CRD enable the `status` subresource?
    options:
      - id: a
        text: "To let users edit status together with spec in one request."
        explanation: "With the subresource, normal updates ignore status."
      - id: b
        text: "To keep what the user declares apart from what the platform reports, with a separate permission for the report."
        explanation: "Correct. Controllers write status through its own endpoint."
      - id: c
        text: "To make the CRD faster."
        explanation: "This is not its purpose."
      - id: d
        text: "To allow the CRD to have several versions."
        explanation: "Versions are independent of the subresource."
    correct_option: b
    explanation: "The two parts have different writers."

  - id: ats077-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reason about admission policies and bindings"
    source_readings:
      - sections/section-040/module-01/course-03-guardrails-failure-domains-and-ownership.md
    prompt: |-
      A ValidatingAdmissionPolicy exists and its expression is correct, but violating requests are accepted. What is the most likely cause?
    options:
      - id: a
        text: "No binding selects the namespace, so the policy applies nowhere."
        explanation: "Correct. A policy needs a binding."
      - id: b
        text: "Policies apply only after a cluster restart."
        explanation: "They apply within seconds."
      - id: c
        text: "The expression must be written in Rego."
        explanation: "Policies use CEL."
      - id: d
        text: "Policies cannot deny requests."
        explanation: "The `Deny` action rejects them."
    correct_option: a
    explanation: "The binding scopes the policy."

  - id: ats077-040-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Reason about failure domains"
    source_readings:
      - sections/section-040/module-01/course-03-guardrails-failure-domains-and-ownership.md
    prompt: |-
      The API server and etcd become unavailable. What happens to pods that already run on the node?
    options:
      - id: a
        text: "They are terminated at once."
        explanation: "The kubelet keeps them running."
      - id: b
        text: "They are rescheduled to another node."
        explanation: "Nothing can schedule without the API server."
      - id: c
        text: "They are restarted every minute."
        explanation: "There is no such behavior."
      - id: d
        text: "They keep running, but nothing can be created, changed or scheduled until the control plane returns."
        explanation: "Correct. The data plane continues and the control plane is the failure domain."
    correct_option: d
    explanation: "The kubelet works from local pod specs."

  - id: ats077-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a failure policy for a guardrail"
    source_readings:
      - sections/section-040/module-01/course-03-guardrails-failure-domains-and-ownership.md
    prompt: |-
      A policy guards a security rule. The team must choose `failurePolicy`. Which choice fits and why?
    options:
      - id: a
        text: "`Ignore`, so that requests pass unchecked when the policy cannot run, and the rule may be skipped."
        explanation: "This keeps availability and removes the guardrail."
      - id: b
        text: "`Fail`, because a rule that guards security should reject requests when it cannot be evaluated."
        explanation: "Correct. The platform team accepts reduced availability for safety."
      - id: c
        text: "Either one, because the setting has no effect."
        explanation: "The setting decides the outcome of an evaluation failure."
      - id: d
        text: "`Warn`, which is a failure policy."
        explanation: "`Warn` is a validation action, not a failure policy."
    correct_option: b
    explanation: "The choice trades safety against availability."

